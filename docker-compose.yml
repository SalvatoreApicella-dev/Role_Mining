services:
  backend:
    build: ./backend
    container_name: rolemining-backend
    environment:
      - MOCK_AD=1
      - JWT_SECRET=change-me-in-prod
      - JWT_EXPIRE_MINUTES=240
    ports:
      - "5172:5172"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: rolemining-frontend
    environment:
      - VITE_API_BASE=http://localhost:5172
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
