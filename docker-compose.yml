services:
  backend:
    build: ./backend
    container_name: rolemining-backend
    environment:
      - MOCK_AD=0
      - JWT_SECRET=change-me-in-prod
      - JWT_EXPIRE_MINUTES=240
    ports:
      - "9000:8000"  # ✅ Host:9000 → Container:8000
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: rolemining-frontend
    environment:
      - VITE_API_BASE=http://localhost:9000  # ← CAMBIA 8000 → 9000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
